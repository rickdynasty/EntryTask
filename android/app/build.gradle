apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    entryFile = file("../../src/index.js")
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    // 同变体 A/B可显式开启；模拟器尚未证明稳定收益，默认关闭，不接受外部Intent切换。
    testBuildType providers.gradleProperty('entrytaskTestBuildType').getOrElse('debug')
    namespace "com.entrytask"
    defaultConfig {
        applicationId "com.entrytask"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'boolean', 'RN_WARMUP_ENABLED', providers.gradleProperty('entrytaskRnWarmup').getOrElse('false')
    }
    // 性能采样有冷进程前置条件，显式接入专用源码，不混进日常功能回归。
    sourceSets {
        androidTest {
            if (providers.gradleProperty('entrytaskPerformanceTests').getOrElse('false').toBoolean()) {
                java.srcDir('src/benchmark/java')
            }
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // 外壳直接声明所用能力；沿用已解析的工具链，不依赖业务模块的传递导出。
    implementation('androidx.activity:activity-ktx:1.8.2')
    implementation('androidx.appcompat:appcompat:1.6.1')
    implementation('androidx.fragment:fragment-ktx:1.8.9')
    implementation('androidx.lifecycle:lifecycle-runtime-ktx:2.8.7')
    implementation('androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7')
    implementation('androidx.lifecycle:lifecycle-viewmodel-savedstate:2.8.7')
    implementation('org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1')
    testImplementation('junit:junit:4.13.2')
    testImplementation('org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1')
    testImplementation('org.json:json:20240303')
    androidTestImplementation('androidx.test.ext:junit:1.1.5')
    androidTestImplementation('androidx.test:runner:1.5.2')
    androidTestImplementation('androidx.test:core-ktx:1.5.0')
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    implementation(project(":biz_user"))
    implementation(project(":demo_engine"))
    implementation(project(":lib_net"))
    implementation(project(":lib_base"))
    implementation(project(":lib_storage"))
}

// Shared JSON is runtime data. A regular CLI/Android Studio build packages it too.
def validateRuntimeResources = tasks.register("validateRuntimeResources", Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine "node", "tools/validate-resources.cjs"
    inputs.dir("../../mock")
    inputs.dir("../../contracts")
    inputs.file("../../tools/validate-resources.cjs")
    inputs.file("../../src/infrastructure/network/generated/validators.js")
}
// AGP must register the producer, not only its directory. A plain srcDir(TaskProvider)
// lost the dependency in this AGP version: clean builds silently omitted all JSON.
abstract class RuntimeAssetsTask extends DefaultTask {
    @InputDirectory abstract DirectoryProperty getMockDirectory()
    @InputDirectory abstract DirectoryProperty getContractDirectory()
    @OutputDirectory abstract DirectoryProperty getOutputDirectory()
    @javax.inject.Inject abstract org.gradle.api.file.FileSystemOperations getFileSystemOperations()

    @TaskAction void prepare() {
        fileSystemOperations.sync {
            into(outputDirectory)
            from(mockDirectory) { into "mock" }
            from(contractDirectory) { into "contracts" }
        }
    }
}
androidComponents {
    onVariants(selector().all()) { variant ->
        def prepareAssets = tasks.register("prepare${variant.name.capitalize()}RuntimeResources", RuntimeAssetsTask) {
            dependsOn(validateRuntimeResources)
            mockDirectory.set(layout.projectDirectory.dir("../../mock"))
            contractDirectory.set(layout.projectDirectory.dir("../../contracts"))
            outputDirectory.set(layout.buildDirectory.dir("generated/entrytaskAssets/${variant.name}"))
        }
        variant.sources.assets.addGeneratedSourceDirectory(prepareAssets) { it.outputDirectory }
    }
}
